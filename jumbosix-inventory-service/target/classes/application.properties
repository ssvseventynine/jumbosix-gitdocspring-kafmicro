# Assign a unique port (8083) so it runs alongside Product (8081) and Order (8082)
server.port=8083

# Service Identity
spring.application.name=inventory-service

# Database Connection Details (Pointing to the Inventory DB)
spring.datasource.url=jdbc:mysql://localhost:3306/jumbosix_inventory_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sidhant@123

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connect to Eureka Discovery Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Location of the running local Kafka broker
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Group Identity
spring.kafka.consumer.group-id=inventory-group

# Auto-offset configuration (start reading from the earliest unread message)
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializer classes configured to safely handle both plain strings and JSON objects
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Configure the delegate deserializer as JSON and allow type inference trust mapping
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*