# Assign a dedicated distinct port for the service
server.port=8081

# Unique Application Identity
spring.application.name=product-service

# Database Connection Credentials
spring.datasource.url=jdbc:mysql://localhost:3306/jumbosix_product_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sidhant@123

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Tell this client where Eureka Server lives
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Kafka Producer Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer